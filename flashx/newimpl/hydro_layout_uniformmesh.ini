; UniformMesh-backed backend for NewImpl. cell_field holds a zero-copy pointer into
; the mesh's single buffer (AoS: values(var,ix,jy,kz,block), block-local halo bounds
; identical across blocks) set up through mesh_f_field_ptr; the %mesh flag tells
; release_cell that the storage is mesh-owned and must not be deallocated. flux and
; scratch fields stay ordinary allocatables. Only this backend file knows the storage.
field_types
definition=
  type :: cell_field
    real(rk), pointer :: values(:,:,:,:,:) => null()
    integer :: mesh=0
  end type
  type :: flux_field
    real(rk), allocatable :: values(:,:,:,:,:,:)
  end type

; AoS, exactly like the default hydro_layout.ini
cell_ref
args=data,var,block,ix,jy,kz
definition=${data}%values(${var},${ix},${jy},${kz},${block})

face_ref
args=data,var,block,dir,ix,jy,kz
definition=${data}%values(${var},${ix},${jy},${kz},${dir},${block})

; mesh-backed cell fields are bound in the caller (mesh_f_field_ptr) instead of
; allocated here; scratch cell fields still use the allocatable path.
allocate_cell
args=data,nvar,lo,hi,nblock
definition=
  if (${data}%mesh==0) &
    allocate(${data}%values(${nvar},${lo}(1):${hi}(1),${lo}(2):${hi}(2), &
                           ${lo}(3):${hi}(3),${nblock}))

allocate_flux
args=data,nvar,lo,hi,ndim,nblock
definition=
  allocate(${data}%values(${nvar},${lo}(1):${hi}(1),${lo}(2):${hi}(2), &
                         ${lo}(3):${hi}(3),${ndim},${nblock}))

release_cell
args=data
definition=
  if (${data}%mesh==0 .and. associated(${data}%values)) &
    deallocate(${data}%values)
  nullify(${data}%values)
  ${data}%mesh=0

release_flux
args=data
definition=
  if (allocated(${data}%values)) &
    deallocate(${data}%values)

flat_ref
args=data,block,ix,jy,kz
definition=@cell_ref(${data},1,${block},${ix},${jy},${kz})@

; One-dimensional coordinates, widths, and grid velocities supplied explicitly.
line_ref
args=data,index
definition=${data}(${index})
